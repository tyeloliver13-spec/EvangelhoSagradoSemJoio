
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evangelho Sagrado Sem Joio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #29251e;
  text-align: center;
}

header {
  background: #49351f;
  color: white;
  padding: 18px 10px;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

main { padding: 15px; }
#inicio { padding: 12px; }

.capa {
  width: 75%;
  max-width: 280px;
  height: auto;
  display: block;
  margin: 15px auto;
  border-radius: 8px;
  cursor: pointer;
}

button {
  background: #49351f;
  color: white;
  border: none;
  padding: 13px 17px;
  border-radius: 8px;
  font-size: 16px;
  margin: 6px;
  cursor: pointer;
}

button:disabled { opacity: .5; }

#leitor {
  display: none;
  padding: 10px;
}

#campoPesquisa {
  width: 100%;
  padding: 14px;
  border: 1px solid #8c765e;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 8px;
}

#resultados {
  text-align: left;
  margin: 8px auto 15px;
  max-width: 700px;
}

.resultado {
  background: white;
  border: 1px solid #d4c6b3;
  border-radius: 8px;
  padding: 12px;
  margin: 7px 0;
  cursor: pointer;
}

#areaLeitura {
  background: #30271e;
  padding: 8px;
  border-radius: 8px;
  overflow: hidden;
  touch-action: pan-y;
}

#paginaPDF {
  display: block;
  max-width: 100%;
  height: auto;
  margin: auto;
  background: white;
}

#informacao {
  margin: 10px;
  font-weight: bold;
}

#trechoEncontrado {
  background: #fff;
  border: 1px solid #d4c6b3;
  border-radius: 8px;
  padding: 12px;
  margin: 10px 0;
  text-align: left;
  display: none;
}

#status {
  font-size: 14px;
  margin: 8px;
}
</style>
</head>

<body>

<header>
  <h1>EVANGELHO SAGRADO SEM JOIO</h1>
  <p>NOVO TESTAMENTO</p>
</header>

<main>

<section id="inicio">
  <img
    class="capa"
    src="capa_evangelho_sagrado-1.jpg"
    alt="Capa do Evangelho Sagrado Sem Joio"
    onclick="abrirLivro()"
  >

  <button onclick="abrirLivro()">ABRIR LIVRO</button>
  <button onclick="compartilhar()">COMPARTILHAR</button>
</section>

<section id="leitor">

  <input
    id="campoPesquisa"
    type="search"
    placeholder="Pesquisar livro, capítulo, versículo ou palavra..."
  >

  <button onclick="pesquisar()">PESQUISAR</button>
  <button onclick="voltarInicio()">VOLTAR AO INÍCIO</button>

  <div id="status"></div>
  <div id="resultados"></div>
  <div id="trechoEncontrado"></div>
  <div id="informacao"></div>

  <div id="areaLeitura">
    <canvas id="paginaPDF"></canvas>
  </div>

  <div>
    <button onclick="paginaAnterior()">◀ ANTERIOR</button>
    <button onclick="proximaPagina()">PRÓXIMA ▶</button>
  </div>

  <div id="numeroPagina"></div>

</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null;
let paginaAtual = 1;
let totalPaginas = 0;
let textosPaginas = {};
let carregando = false;

/* LISTA DE LIVROS: JOÃO ATÉ APOCALIPSE */

const livros = [
  "João",
  "Atos",
  "Romanos",
  "1 Coríntios",
  "2 Coríntios",
  "Gálatas",
  "Efésios",
  "Filipenses",
  "Colossenses",
  "1 Tessalonicenses",
  "2 Tessalonicenses",
  "1 Timóteo",
  "2 Timóteo",
  "Tito",
  "Filemom",
  "Hebreus",
  "Tiago",
  "1 Pedro",
  "2 Pedro",
  "1 João",
  "2 João",
  "3 João",
  "Judas",
  "Apocalipse"
];

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escaparRegex(texto) {
  return texto.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

async function abrirLivro() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("leitor").style.display = "block";

  if (!pdf) {
    document.getElementById("status").textContent =
      "Carregando o livro...";

    try {
      const tarefa = pdfjsLib.getDocument("evangelho_sagrado.pdf");
      pdf = await tarefa.promise;
      totalPaginas = pdf.numPages;

      document.getElementById("status").textContent =
        "Livro carregado. Você já pode pesquisar.";

      await mostrarPagina(1);

    } catch (erro) {
      document.getElementById("status").textContent =
        "Não foi possível abrir o PDF. Verifique o arquivo.";
      console.error(erro);
    }
  } else {
    await mostrarPagina(paginaAtual);
  }
}

function voltarInicio() {
  document.getElementById("leitor").style.display = "none";
  document.getElementById("inicio").style.display = "block";
}

async function mostrarPagina(numero) {
  if (!pdf || carregando) return;

  numero = Math.max(1, Math.min(numero, totalPaginas));
  paginaAtual = numero;
  carregando = true;

  try {
    const pagina = await pdf.getPage(numero);
    const canvas = document.getElementById("paginaPDF");
    const contexto = canvas.getContext("2d");

    const larguraMaxima = Math.min(
      document.getElementById("areaLeitura").clientWidth - 16,
      900
    );

    const escalaOriginal = pagina.getViewport({scale: 1});
    const escala = larguraMaxima / escalaOriginal.width;
    const viewport = pagina.getViewport({scale: escala});

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await pagina.render({
      canvasContext: contexto,
      viewport: viewport
    }).promise;

    document.getElementById("numeroPagina").textContent =
      "Página " + numero + " de " + totalPaginas;

    document.getElementById("informacao").textContent =
      "Evangelho Sagrado Sem Joio";

  } catch (erro) {
    console.error(erro);
  }

  carregando = false;
}

async function obterTexto(numero) {
  if (textosPaginas[numero] !== undefined) {
    return textosPaginas[numero];
  }

  const pagina = await pdf.getPage(numero);
  const conteudo = await pagina.getTextContent();

  const texto = conteudo.items
    .map(item => item.str)
    .join(" ");

  textosPaginas[numero] = texto;

  return texto;
}

function encontrarCabecalho(texto, livro, capitulo) {
  const nome = escaparRegex(livro);

  const regex = new RegExp(
    "\\b" + nome + "\\s+(\\d{1,3})(?:\\s*[,/]\\s*(\\d{1,3}))?",
    "gi"
  );

  let resultado;

  while ((resultado = regex.exec(texto)) !== null) {
    if (
      Number(resultado[1]) === capitulo ||
      Number(resultado[2]) === capitulo
    ) {
      return resultado.index;
    }
  }

  return -1;
}

function encontrarVersiculo(texto, versiculo, inicio) {
  const regex = new RegExp(
    "(?:^|\\s)" + versiculo +
    "\\s*(?=[A-ZÁÉÍÓÚÀÂÊÔÃÕÇ(])",
    "g"
  );

  regex.lastIndex = Math.max(0, inicio);

  const resultado = regex.exec(texto);

  return resultado ? resultado.index : -1;
}

async function pesquisarReferencia(livro, capitulo, versiculo) {
  let encontrouCapitulo = false;
  let paginaCapitulo = 1;

  for (let numero = 1; numero <= totalPaginas; numero++) {
    const texto = await obterTexto(numero);

    const cabecalho = encontrarCabecalho(
      texto, livro, capitulo
    );

    if (cabecalho >= 0 && !encontrouCapitulo) {
      encontrouCapitulo = true;
      paginaCapitulo = numero;
    }

    if (!encontrouCapitulo) continue;

    const inicio = cabecalho >= 0 ? cabecalho : 0;

    const posicao = encontrarVersiculo(
      texto, versiculo, inicio
    );

    if (posicao >= 0) {
      return {
        pagina: numero,
        texto: texto.substring(posicao, posicao + 260)
      };
    }

    if (numero > paginaCapitulo && cabecalho >= 0) {
      const outroCabecalho = encontrarCabecalho(
        texto, livro, capitulo + 1
      );

      if (outroCabecalho >= 0) break;
    }
  }

  if (encontrouCapitulo) {
    return {
      pagina: paginaCapitulo,
      texto: "Capítulo encontrado. Confira o versículo nesta página."
    };
  }

  return null;
}

async function pesquisar() {
  if (!pdf) {
    await abrirLivro();
    if (!pdf) return;
  }

  const campo = document.getElementById("campoPesquisa");
  const consulta = campo.value.trim();

  const resultados = document.getElementById("resultados");
  const trecho = document.getElementById("trechoEncontrado");

  resultados.innerHTML = "";
  trecho.style.display = "none";

  if (!consulta) {
    document.getElementById("status").textContent =
      "Digite o que deseja pesquisar.";
    return;
  }

  document.getElementById("status").textContent =
    "Pesquisando no livro...";

  const referencia = consulta.match(
    /^(.+?)\s+(\d{1,3})\s*:\s*(\d{1,3})$/
  );

  if (referencia) {
    const nomeDigitado = normalizar(referencia[1]);

    const livro = livros.find(
      nome => normalizar(nome) === nomeDigitado
    );

    if (!livro) {
      document.getElementById("status").textContent =
        "Não reconheci o nome do livro. Confira a escrita.";
      return;
    }

    const capitulo = Number(referencia[2]);
    const versiculo = Number(referencia[3]);

    const resultado = await pesquisarReferencia(
      livro, capitulo, versiculo
    );

    if (resultado) {
      await mostrarPagina(resultado.pagina);

      trecho.style.display = "block";

      trecho.innerHTML =
        "<strong>" + livro + " " + capitulo + ":" +
        versiculo + "</strong><br><br>" +
        resultado.texto;

      document.getElementById("status").textContent =
        "Referência localizada na página " +
        resultado.pagina + " do PDF.";

    } else {
      document.getElementById("status").textContent =
        "Não consegui localizar essa referência no arquivo.";
    }

    return;
  }

  const palavra = normalizar(consulta);
  let quantidade = 0;

  for (let numero = 1; numero <= totalPaginas; numero++) {
    const texto = await obterTexto(numero);

    if (normalizar(texto).includes(palavra)) {
      const botao = document.createElement("div");

      botao.className = "resultado";
      botao.textContent = "Encontrado na página " + numero;

      botao.onclick = async function() {
        await mostrarPagina(numero);
      };

      resultados.appendChild(botao);
      quantidade++;

      if (quantidade >= 30) break;
    }
  }

  document.getElementById("status").textContent =
    quantidade
      ? quantidade + " resultado(s) encontrado(s)."
      : "Nenhum resultado encontrado.";
}

function paginaAnterior() {
  if (paginaAtual > 1) {
    mostrarPagina(paginaAtual - 1);
  }
}

function proximaPagina() {
  if (paginaAtual < totalPaginas) {
    mostrarPagina(paginaAtual + 1);
  }
}

let inicioToqueX = 0;
let fimToqueX = 0;

const area = document.getElementById("areaLeitura");

area.addEventListener("touchstart", function(event) {
  inicioToqueX = event.changedTouches[0].screenX;
}, {passive: true});

area.addEventListener("touchend", function(event) {
  fimToqueX = event.changedTouches[0].screenX;

  const diferenca = fimToqueX - inicioToqueX;

  if (Math.abs(diferenca) > 55) {
    if (diferenca < 0) {
      proximaPagina();
    } else {
      paginaAnterior();
    }
  }
}, {passive: true});

async function compartilhar() {
  const link = window.location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "Evangelho Sagrado Sem Joio",
        text: "Acesse e leia o Evangelho Sagrado Sem Joio.",
        url: link
      });
    } catch (erro) {
      console.log(erro);
    }
  } else {
    try {
      await navigator.clipboard.writeText(link);
      alert("Link copiado para compartilhar!");
    } catch (erro) {
      alert("Copie o endereço do aplicativo para compartilhar.");
    }
  }
}
</script>

</body>
</html>
