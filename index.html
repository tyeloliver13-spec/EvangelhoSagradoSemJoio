
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evangelho Sagrado Sem Joio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #29251e;
  text-align: center;
}

header {
  background: #49351f;
  color: white;
  padding: 22px 12px;
}

h1 {
  margin: 8px 0;
  font-size: 25px;
}

main {
  padding: 20px 14px;
  max-width: 650px;
  margin: auto;
}

/* ÁREA ESCURA COM A CAPA */

.area-livro {
  background: #29251e;
  padding: 18px;
  border-radius: 12px;
  margin: 10px auto 22px;
  max-width: 380px;
}

.capa-botao {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}

.capa {
  width: 100%;
  max-width: 300px;
  height: auto;
  display: block;
  margin: auto;
  border-radius: 6px;
}

.texto-capa {
  color: white;
  margin-top: 12px;
  font-size: 18px;
}

/* BOTÕES */

button {
  background: #49351f;
  color: white;
  border: none;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 16px;
  margin: 7px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.botoes {
  margin: 15px 0;
}

/* PESQUISA */

.pesquisa {
  background: white;
  padding: 18px;
  border-radius: 10px;
  margin-top: 25px;
  text-align: left;
}

.pesquisa h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #b9aa96;
  border-radius: 7px;
  font-size: 16px;
}

#resultados {
  margin-top: 15px;
  line-height: 1.6;
}

.resultado {
  background: #f5f0e6;
  padding: 12px;
  margin: 8px 0;
  border-radius: 7px;
}

.resultado a {
  color: #49351f;
  font-weight: bold;
}

footer {
  padding: 20px;
  color: #665b4c;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>Evangelho Sagrado Sem Joio</h1>
</header>

<main>

  <h2>Bem-vindo!</h2>

  <p>
    Leia e compartilhe este livro gratuitamente.
  </p>

  <!-- CAPA DENTRO DA ÁREA ESCURA -->

  <div class="area-livro">

    <button
      class="capa-botao"
      onclick="abrirLivro()"
      aria-label="Abrir o Evangelho Sagrado">

      <img
        class="capa"
        src="capa_evangelho_sagrado-1.jpg"
        alt="Capa do Evangelho Sagrado Sem Joio">

      <div class="texto-capa">
        Evangelho Sagrado PDF
      </div>

      <div style="color:white; margin-top:8px;">
        TOQUE NA CAPA PARA ABRIR
      </div>

    </button>

  </div>

  <!-- BOTÕES -->

  <div class="botoes">

    <button onclick="abrirLivro()">
      LER O LIVRO
    </button>

    <button onclick="compartilhar()">
      COMPARTILHAR
    </button>

  </div>

  <!-- PESQUISA -->

  <section class="pesquisa">

    <h2>Pesquisar no Evangelho</h2>

    <p>
      Pesquise por livro, capítulo, versículo
      ou palavra.
    </p>

    <input
      type="search"
      id="busca"
      placeholder="Ex.: João 3:16"
      aria-label="Pesquisar no Evangelho">

    <button onclick="pesquisar()">
      PESQUISAR
    </button>

    <div id="resultados" aria-live="polite"></div>

  </section>

</main>

<footer>
  Evangelho Sagrado Sem Joio
  <br>
  Leitura gratuita para todos.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const arquivoPDF = "evangelho_sagrado.pdf";

function abrirLivro() {
  window.open(arquivoPDF, "_blank");
}

async function compartilhar() {

  const dados = {
    title: "Evangelho Sagrado Sem Joio",
    text: "Leia e compartilhe gratuitamente o Evangelho Sagrado Sem Joio.",
    url: window.location.href
  };

  if (navigator.share) {
    try {
      await navigator.share(dados);
    } catch (erro) {
      console.log("Compartilhamento cancelado.");
    }
  } else {
    try {
      await navigator.clipboard.writeText(dados.url);
      alert("Link copiado! Compartilhe com seus amigos.");
    } catch (erro) {
      alert("Copie o endereço do aplicativo para compartilhar.");
    }
  }
}

// CONFIGURAÇÃO DA PESQUISA

let documentoPDF = null;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

async function carregarPDF() {

  if (documentoPDF) return documentoPDF;

  if (!window.pdfjsLib) {
    throw new Error("Não foi possível carregar o sistema de pesquisa.");
  }

  const tarefa = pdfjsLib.getDocument(arquivoPDF);
  documentoPDF = await tarefa.promise;

  return documentoPDF;
}

function normalizar(texto) {
  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

async function pesquisar() {

  const campo = document.getElementById("busca");
  const resultados = document.getElementById("resultados");

  const termo = normalizar(campo.value);

  if (!termo) {
    resultados.textContent = "Digite o livro, capítulo, versículo ou palavra que deseja encontrar.";
    return;
  }

  resultados.textContent = "Pesquisando no Evangelho...";

  try {

    const pdf = await carregarPDF();

    let encontrados = [];

    for (let numero = 1; numero <= pdf.numPages; numero++) {

      const pagina = await pdf.getPage(numero);
      const conteudo = await pagina.getTextContent();

      const texto = conteudo.items
        .map(item => item.str)
        .join(" ");

      if (normalizar(texto).includes(termo)) {

        encontrados.push({
          pagina: numero,
          texto: texto.substring(0, 220)
        });

      }

      if (encontrados.length >= 30) break;
    }

    if (encontrados.length === 0) {
      resultados.textContent =
        "Nenhum resultado encontrado. Confira a escrita ou tente outra pesquisa.";
      return;
    }

    resultados.innerHTML =
      "<strong>Resultados encontrados:</strong>";

    encontrados.forEach(item => {

      const div = document.createElement("div");
      div.className = "resultado";

      const descricao = document.createElement("p");
      descricao.textContent = item.texto + "...";

      const link = document.createElement("a");
      link.href = arquivoPDF + "#page=" + item.pagina;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "Abrir página " + item.pagina;

      div.appendChild(descricao);
      div.appendChild(link);

      resultados.appendChild(div);

    });

  } catch (erro) {

    resultados.textContent =
      "Não foi possível realizar a pesquisa. Verifique se o PDF está disponível e tente novamente.";

    console.error(erro);

  }
}

document.getElementById("busca").addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      pesquisar();
    }
  }
);

</script>

</body>
</html>
