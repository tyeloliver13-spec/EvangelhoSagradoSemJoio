
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evangelho Sagrado Sem Joio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #29251e;
  text-align: center;
}

header {
  background: #49351f;
  color: white;
  padding: 20px 10px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 18px 12px;
}

.area-livro {
  background: #29251e;
  padding: 18px;
  border-radius: 12px;
  max-width: 380px;
  margin: 20px auto;
}

.capa-botao {
  border: 0;
  background: transparent;
  padding: 0;
  width: 100%;
  cursor: pointer;
}

.capa {
  width: 100%;
  max-width: 300px;
  height: auto;
  display: block;
  margin: auto;
  border-radius: 6px;
}

.texto-capa {
  color: white;
  font-size: 18px;
  margin-top: 12px;
}

button {
  background: #49351f;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 13px 18px;
  font-size: 16px;
  margin: 6px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.pesquisa {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
  text-align: left;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #b9aa96;
  border-radius: 7px;
  font-size: 16px;
}

#leitor {
  display: none;
  margin-top: 20px;
}

#leitor.ativo {
  display: block;
}

.controles {
  background: #e8dfd1;
  padding: 10px;
  border-radius: 9px;
  margin: 12px 0;
}

#paginaPDF {
  background: white;
  padding: 8px;
  min-height: 200px;
  overflow: auto;
  border-radius: 8px;
}

#paginaPDF canvas {
  display: block;
  max-width: 100%;
  height: auto;
  margin: auto;
}

.resultado {
  background: #f5f0e6;
  border-radius: 7px;
  padding: 10px;
  margin-top: 9px;
}

.resultado button {
  font-size: 14px;
}

#mensagem {
  font-size: 14px;
  line-height: 1.5;
}

footer {
  padding: 20px;
  font-size: 13px;
  color: #665b4c;
}
</style>
</head>

<body>

<header>
  <h1>Evangelho Sagrado Sem Joio</h1>
</header>

<main>

  <section id="inicio">

    <h2>Bem-vindo!</h2>

    <p>Leia e compartilhe este livro gratuitamente.</p>

    <div class="area-livro">

      <button class="capa-botao" onclick="abrirLivro()">

        <img
          class="capa"
          src="capa_evangelho_sagrado-1.jpg"
          alt="Capa do Evangelho Sagrado Sem Joio">

        <div class="texto-capa">
          Evangelho Sagrado PDF
        </div>

        <p style="color:white;">
          TOQUE NA CAPA PARA ABRIR
        </p>

      </button>

    </div>

    <button onclick="abrirLivro()">LER O LIVRO</button>

    <button onclick="compartilhar()">COMPARTILHAR</button>

  </section>

  <!-- LEITOR DO LIVRO -->

  <section id="leitor">

    <h2>Leitura do Evangelho</h2>

    <div class="pesquisa">

      <h3>Pesquisar no Evangelho</h3>

      <p>
        Pesquise por livro, capítulo, versículo
        ou palavra.
      </p>

      <input
        id="busca"
        type="search"
        placeholder="Ex.: João 3:16">

      <button onclick="pesquisar()">
        PESQUISAR
      </button>

      <div id="mensagem"></div>

      <div id="resultados"></div>

    </div>

    <div class="controles">

      <button onclick="paginaAnterior()">
        ANTERIOR
      </button>

      <span id="numeroPagina">Página 1</span>

      <button onclick="proximaPagina()">
        PRÓXIMA
      </button>

    </div>

    <div id="paginaPDF">
      Carregando o livro...
    </div>

    <button onclick="voltarInicio()">
      VOLTAR AO INÍCIO
    </button>

  </section>

</main>

<footer>
  Evangelho Sagrado Sem Joio
  <br>
  Leitura gratuita para todos.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const arquivoPDF = "evangelho_sagrado.pdf";

let documentoPDF = null;
let paginaAtual = 1;
let pesquisando = false;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function carregarPDF() {

  if (documentoPDF) return documentoPDF;

  const tarefa = pdfjsLib.getDocument(arquivoPDF);

  documentoPDF = await tarefa.promise;

  return documentoPDF;
}

async function abrirLivro() {

  document.getElementById("inicio").style.display = "none";

  const leitor = document.getElementById("leitor");

  leitor.classList.add("ativo");

  try {

    await carregarPDF();

    paginaAtual = 1;

    await mostrarPagina(paginaAtual);

  } catch (erro) {

    document.getElementById("paginaPDF").textContent =
      "Não foi possível abrir o PDF. Confira se o arquivo evangelho_sagrado.pdf está no GitHub.";

  }

}

function voltarInicio() {

  document.getElementById("leitor").classList.remove("ativo");

  document.getElementById("inicio").style.display = "block";

  window.scrollTo(0, 0);

}

async function mostrarPagina(numero) {

  const pdf = await carregarPDF();

  if (numero < 1 || numero > pdf.numPages) return;

  paginaAtual = numero;

  const pagina = await pdf.getPage(numero);

  const area = document.getElementById("paginaPDF");

  const escalaBase = 1.5;

  const viewportOriginal = pagina.getViewport({
    scale: escalaBase
  });

  const larguraMaxima = Math.min(
    area.clientWidth - 16,
    650
  );

  const escala = escalaBase * Math.min(
    1,
    larguraMaxima / viewportOriginal.width
  );

  const viewport = pagina.getViewport({
    scale: escala
  });

  const canvas = document.createElement("canvas");

  const contexto = canvas.getContext("2d");

  canvas.width = viewport.width;
  canvas.height = viewport.height;

  area.innerHTML = "";

  area.appendChild(canvas);

  await pagina.render({
    canvasContext: contexto,
    viewport: viewport
  }).promise;

  document.getElementById("numeroPagina").textContent =
    "Página " + numero + " de " + pdf.numPages;

}

async function paginaAnterior() {

  if (paginaAtual > 1) {
    await mostrarPagina(paginaAtual - 1);
  }

}

async function proximaPagina() {

  const pdf = await carregarPDF();

  if (paginaAtual < pdf.numPages) {
    await mostrarPagina(paginaAtual + 1);
  }

}

function normalizar(texto) {

  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();

}

async function pesquisar() {

  if (pesquisando) return;

  const termoOriginal =
    document.getElementById("busca").value.trim();

  const termo = normalizar(termoOriginal);

  const mensagem = document.getElementById("mensagem");
  const resultados = document.getElementById("resultados");

  resultados.innerHTML = "";

  if (!termo) {

    mensagem.textContent = "Digite o que deseja pesquisar.";

    return;

  }

  pesquisando = true;

  mensagem.textContent = "Pesquisando no Evangelho...";

  try {

    const pdf = await carregarPDF();

    let encontrados = [];

    for (let numero = 1; numero <= pdf.numPages; numero++) {

      const pagina = await pdf.getPage(numero);

      const conteudo = await pagina.getTextContent();

      const texto = conteudo.items
        .map(item => item.str)
        .join(" ");

      if (normalizar(texto).includes(termo)) {

        encontrados.push({
          numero: numero,
          texto: texto.substring(0, 250)
        });

      }

      if (encontrados.length >= 50) break;

    }

    if (encontrados.length === 0) {

      mensagem.textContent =
        "Nenhum resultado encontrado. Tente outra palavra ou expressão.";

      return;

    }

    mensagem.textContent =
      encontrados.length + " resultado(s) encontrado(s):";

    encontrados.forEach(item => {

      const div = document.createElement("div");

      div.className = "resultado";

      const texto = document.createElement("p");

      texto.textContent = item.texto + "...";

      const botao = document.createElement("button");

      botao.textContent = "ABRIR PÁGINA " + item.numero;

      botao.onclick = async function() {

        await mostrarPagina(item.numero);

        document.getElementById("paginaPDF")
          .scrollIntoView({ behavior: "smooth" });

      };

      div.appendChild(texto);

      div.appendChild(botao);

      resultados.appendChild(div);

    });

  } catch (erro) {

    mensagem.textContent =
      "Erro na pesquisa. Confira a conexão e o arquivo PDF.";

  } finally {

    pesquisando = false;

  }

}

document.getElementById("busca").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      pesquisar();
    }

  }
);

async function compartilhar() {

  const dados = {
    title: "Evangelho Sagrado Sem Joio",
    text: "Leia gratuitamente o Evangelho Sagrado Sem Joio.",
    url: window.location.href
  };

  if (navigator.share) {

    try {
      await navigator.share(dados);
    } catch (erro) {
      console.log("Compartilhamento cancelado.");
    }

  } else {

    try {

      await navigator.clipboard.writeText(dados.url);

      alert("Link copiado para compartilhar!");

    } catch (erro) {

      alert("Copie o endereço do aplicativo para compartilhar.");

    }

  }

}

</script>

</body>
</html>
