<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evangelho Sagrado Sem Joio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #29251e;
  text-align: center;
}

header {
  background: #49351f;
  color: white;
  padding: 18px 10px;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

main {
  padding: 15px;
}

.area-livro {
  background: #21180f;
  border-radius: 12px;
  padding: 18px;
  max-width: 420px;
  margin: 20px auto;
}

.capa {
  display: block;
  width: 100%;
  max-width: 300px;
  height: auto;
  margin: auto;
  border-radius: 5px;
}

button {
  background: #49351f;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 8px;
  font-size: 16px;
  margin: 6px;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

#leitor {
  display: none;
  width: 100%;
  max-width: 800px;
  margin: auto;
}

/* Pesquisa fixa acima da leitura */
.pesquisa-fixa {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #f5f0e6;
  padding: 12px 5px;
  border-bottom: 1px solid #d2c5b3;
}

#campoPesquisa {
  width: 100%;
  max-width: 500px;
  padding: 13px;
  border: 1px solid #a99a85;
  border-radius: 8px;
  font-size: 16px;
}

#resultados {
  max-height: 180px;
  overflow-y: auto;
  background: #fff;
  border-radius: 8px;
  margin: 8px auto;
  max-width: 500px;
}

.resultado {
  display: block;
  width: 95%;
  margin: 6px auto;
  background: #eee5d8;
  color: #29251e;
}

/* Área de leitura horizontal */
#areaLeitura {
  position: relative;
  width: 100%;
  min-height: 55vh;
  margin: 15px auto;
  overflow: hidden;
  background: #ded5c7;
  border-radius: 8px;
  border: 1px solid #b9aa96;
  touch-action: pan-y;
  user-select: none;
}

#paginaPDF {
  width: 100%;
  min-height: 55vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 8px;
  transition: transform 0.18s ease;
}

#paginaPDF.animando-esquerda {
  transform: translateX(-35px);
}

#paginaPDF.animando-direita {
  transform: translateX(35px);
}

#paginaPDF canvas {
  display: block;
  max-width: 100%;
  height: auto;
  background: white;
  box-shadow: 0 2px 8px #0003;
  pointer-events: none;
}

.controles {
  padding: 10px;
}

#numeroPagina {
  font-weight: bold;
  margin: 8px;
}

#mensagem {
  padding: 8px;
  font-size: 14px;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 20px;
  }

  #areaLeitura {
    min-height: 60vh;
  }
}
</style>
</head>

<body>

<header>
  <h1>Evangelho Sagrado Sem Joio</h1>
</header>

<main>

<section id="inicio">

  <h2>Bem-vindo</h2>

  <div class="area-livro">
    <img
      class="capa"
      src="capa_evangelho_sagrado-1.jpg"
      alt="Capa do Evangelho Sagrado Sem Joio"
      onclick="abrirLivro()"
    >
  </div>

  <button onclick="abrirLivro()">ABRIR O EVANGELHO</button>

  <button onclick="compartilhar()">COMPARTILHAR</button>

</section>

<section id="leitor">

  <div class="pesquisa-fixa">
    <input
      id="campoPesquisa"
      type="search"
      placeholder="Pesquisar livro, capítulo, versículo ou palavra..."
    >

    <button onclick="pesquisar()">PESQUISAR</button>

    <div id="resultados"></div>
  </div>

  <h2>Evangelho Sagrado</h2>

  <div id="mensagem">Carregando o Evangelho...</div>

  <div id="areaLeitura">
    <div id="paginaPDF"></div>
  </div>

  <div class="controles">
    <button onclick="paginaAnterior()">← ANTERIOR</button>

    <span id="numeroPagina">Página 1</span>

    <button onclick="proximaPagina()">PRÓXIMA →</button>
  </div>

  <button onclick="voltarInicio()">VOLTAR AO INÍCIO</button>

</section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null;
let paginaAtual = 1;
let totalPaginas = 0;
let renderizando = false;

async function abrirLivro() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("leitor").style.display = "block";

  if (pdf) {
    mostrarPagina(1);
    return;
  }

  document.getElementById("mensagem").textContent =
    "Carregando o livro...";

  try {
    pdf = await pdfjsLib.getDocument("evangelho_sagrado.pdf").promise;

    totalPaginas = pdf.numPages;
    paginaAtual = 1;

    document.getElementById("mensagem").textContent =
      "Evangelho carregado. Deslize para os lados para virar as páginas.";

    mostrarPagina(1);

  } catch (erro) {
    document.getElementById("mensagem").textContent =
      "Não foi possível abrir o PDF. Confira se o arquivo evangelho_sagrado.pdf está no GitHub.";
  }
}

async function mostrarPagina(numero) {
  if (!pdf || renderizando) return;

  if (numero < 1 || numero > totalPaginas) return;

  renderizando = true;
  paginaAtual = numero;

  const area = document.getElementById("paginaPDF");
  area.innerHTML = "";

  try {
    const pagina = await pdf.getPage(numero);

    const larguraDisponivel =
      Math.min(area.clientWidth - 16, 750);

    const escalaOriginal = pagina.getViewport({ scale: 1 });

    const escala = larguraDisponivel / escalaOriginal.width;

    const viewport = pagina.getViewport({ scale: escala });

    const canvas = document.createElement("canvas");
    const contexto = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    area.appendChild(canvas);

    await pagina.render({
      canvasContext: contexto,
      viewport: viewport
    }).promise;

    document.getElementById("numeroPagina").textContent =
      "Página " + paginaAtual + " de " + totalPaginas;

  } catch (erro) {
    document.getElementById("mensagem").textContent =
      "Erro ao mostrar esta página.";
  }

  renderizando = false;
}

function proximaPagina() {
  if (paginaAtual < totalPaginas) {
    animarPagina("esquerda");
    mostrarPagina(paginaAtual + 1);
  }
}

function paginaAnterior() {
  if (paginaAtual > 1) {
    animarPagina("direita");
    mostrarPagina(paginaAtual - 1);
  }
}

function animarPagina(direcao) {
  const area = document.getElementById("paginaPDF");

  area.classList.remove(
    "animando-esquerda",
    "animando-direita"
  );

  if (direcao === "esquerda") {
    area.classList.add("animando-esquerda");
  } else {
    area.classList.add("animando-direita");
  }

  setTimeout(() => {
    area.classList.remove(
      "animando-esquerda",
      "animando-direita"
    );
  }, 180);
}

/* Deslizar o dedo para virar as páginas */
let inicioX = 0;
let inicioY = 0;

const areaLeitura = document.getElementById("areaLeitura");

areaLeitura.addEventListener("touchstart", function(event) {
  inicioX = event.changedTouches[0].screenX;
  inicioY = event.changedTouches[0].screenY;
}, { passive: true });

areaLeitura.addEventListener("touchend", function(event) {
  const fimX = event.changedTouches[0].screenX;
  const fimY = event.changedTouches[0].screenY;

  const diferencaX = fimX - inicioX;
  const diferencaY = fimY - inicioY;

  if (Math.abs(diferencaX) > 50 &&
      Math.abs(diferencaX) > Math.abs(diferencaY)) {

    if (diferencaX < 0) {
      proximaPagina();
    } else {
      paginaAnterior();
    }
  }
}, { passive: true });

/* Pesquisa dentro do PDF */
async function pesquisar() {
  if (!pdf) return;

  const campo = document.getElementById("campoPesquisa");
  const termo = normalizar(campo.value);

  const resultados = document.getElementById("resultados");
  resultados.innerHTML = "";

  if (!termo) {
    resultados.textContent = "Digite algo para pesquisar.";
    return;
  }

  resultados.textContent = "Pesquisando no Evangelho...";

  const encontrados = [];

  for (let i = 1; i <= totalPaginas; i++) {
    const pagina = await pdf.getPage(i);
    const texto = await pagina.getTextContent();

    const conteudo = normalizar(
      texto.items.map(item => item.str).join(" ")
    );

    if (conteudo.includes(termo)) {
      encontrados.push(i);
    }

    if (encontrados.length >= 50) break;
  }

  resultados.innerHTML = "";

  if (encontrados.length === 0) {
    resultados.textContent = "Nenhum resultado encontrado.";
    return;
  }

  encontrados.forEach(numero => {
    const botao = document.createElement("button");

    botao.className = "resultado";
    botao.textContent = "ABRIR PÁGINA " + numero;

    botao.onclick = function() {
      mostrarPagina(numero);

      document.getElementById("resultados").innerHTML = "";
    };

    resultados.appendChild(botao);
  });
}

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function voltarInicio() {
  document.getElementById("leitor").style.display = "none";
  document.getElementById("inicio").style.display = "block";
}

async function compartilhar() {
  const endereco = window.location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "Evangelho Sagrado Sem Joio",
        text: "Leia o Evangelho Sagrado Sem Joio.",
        url: endereco
      });
    } catch (erro) {
      // Compartilhamento cancelado pelo usuário.
    }
  } else {
    try {
      await navigator.clipboard.writeText(endereco);
      alert("Endereço do aplicativo copiado!");
    } catch (erro) {
      alert("Copie o endereço do aplicativo para compartilhar.");
    }
  }
}
</script>

</body>
</html>
