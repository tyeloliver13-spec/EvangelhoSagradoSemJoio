
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evangelho Sagrado Sem Joio</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #29251e;
}

body {
  text-align: center;
}

header {
  background: #123f78;
  color: white;
  padding: 15px 10px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 14px;
}

.botoesInicio {
  background: #123f78;
  padding: 8px 5px 12px;
}

button {
  background: #1760a8;
  color: white;
  border: none;
  padding: 13px 17px;
  border-radius: 8px;
  font-size: 16px;
  margin: 5px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#inicio {
  min-height: calc(100vh - 110px);
  display: flex;
  flex-direction: column;
}

.capa {
  display: block;
  width: 100%;
  max-width: 100%;
  height: calc(100vh - 125px);
  object-fit: contain;
  object-position: center;
  margin: 0 auto;
  padding: 5px;
  cursor: pointer;
}

#leitor {
  display: none;
  padding: 10px;
}

#campoPesquisa {
  display: block;
  width: 100%;
  max-width: 900px;
  margin: 5px auto 10px;
  padding: 18px;
  border: 2px solid #1760a8;
  border-radius: 10px;
  font-size: 18px;
}

.botoesLeitor {
  margin-bottom: 10px;
}

#resultados {
  text-align: left;
  margin: 8px auto 15px;
  max-width: 900px;
}

.resultado {
  background: white;
  border: 1px solid #d4c6b3;
  border-radius: 8px;
  padding: 13px;
  margin: 7px 0;
  cursor: pointer;
}

#trechoEncontrado {
  background: white;
  border: 1px solid #d4c6b3;
  border-radius: 8px;
  padding: 12px;
  margin: 10px auto;
  max-width: 900px;
  text-align: left;
  display: none;
  line-height: 1.6;
}

#status {
  font-size: 14px;
  margin: 10px;
}

#informacao {
  margin: 10px;
  font-weight: bold;
}

#numeroPagina {
  margin: 10px;
  font-weight: bold;
}

#areaLeitura {
  background: #30271e;
  padding: 8px;
  border-radius: 8px;
  width: 100%;
  height: 72vh;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}

.pagina {
  width: 100%;
  max-width: 950px;
  margin: 0 auto 12px;
  background: white;
}

.pagina canvas {
  display: block;
  width: 100%;
  height: auto;
  background: white;
}

.carregandoPagina {
  padding: 35px 10px;
  color: #555;
  background: white;
  width: 100%;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 19px;
  }

  button {
    font-size: 14px;
    padding: 12px;
  }

  #areaLeitura {
    height: 72vh;
    padding: 4px;
  }

  .pagina {
    margin-bottom: 8px;
  }
}
</style>
</head>

<body>

<header>
  <h1>EVANGELHO SAGRADO SEM JOIO</h1>
  <p>NOVO TESTAMENTO</p>
</header>

<section id="inicio">
  <div class="botoesInicio">
    <button onclick="abrirLivro()">ABRIR LIVRO</button>
    <button onclick="compartilhar()">COMPARTILHAR</button>
  </div>

  <img
    class="capa"
    src="capa_evangelho_sagrado-1.jpg"
    alt="Capa do Evangelho Sagrado Sem Joio"
    onclick="abrirLivro()"
  >
</section>

<main id="leitor">

  <input
    id="campoPesquisa"
    type="search"
    placeholder="Pesquise livro, capítulo, versículo ou palavra..."
    onkeydown="if(event.key === 'Enter') pesquisar()"
  >

  <div class="botoesLeitor">
    <button onclick="pesquisar()">PESQUISAR</button>
    <button onclick="voltarInicio()">VOLTAR AO INÍCIO</button>
  </div>

  <div id="status"></div>
  <div id="resultados"></div>
  <div id="trechoEncontrado"></div>
  <div id="informacao">Evangelho Sagrado Sem Joio</div>

  <div id="areaLeitura"></div>

  <div>
    <button onclick="paginaAnterior()">◀ ANTERIOR</button>
    <button onclick="proximaPagina()">PRÓXIMA ▶</button>
  </div>

  <div id="numeroPagina"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdf = null;
let paginaAtual = 1;
let totalPaginas = 0;
let textosPaginas = {};
let paginasElementos = {};
let paginasRenderizadas = {};
let paginasRenderizando = {};
let observador = null;

const livros = [
  "João",
  "Atos",
  "Romanos",
  "1 Coríntios",
  "2 Coríntios",
  "Gálatas",
  "Efésios",
  "Filipenses",
  "Colossenses",
  "1 Tessalonicenses",
  "2 Tessalonicenses",
  "1 Timóteo",
  "2 Timóteo",
  "Tito",
  "Filemom",
  "Hebreus",
  "Tiago",
  "1 Pedro",
  "2 Pedro",
  "1 João",
  "2 João",
  "3 João",
  "Judas",
  "Apocalipse"
];

function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escaparRegex(texto) {
  return texto.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

async function abrirLivro() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("leitor").style.display = "block";

  if (!pdf) {
    document.getElementById("status").textContent =
      "Carregando o livro...";

    try {
      const tarefa = pdfjsLib.getDocument("evangelho_sagrado.pdf");
      pdf = await tarefa.promise;
      totalPaginas = pdf.numPages;

      criarPaginas();

      document.getElementById("status").textContent =
        "Livro carregado. Você já pode pesquisar.";

      await mostrarPagina(1);

    } catch (erro) {
      document.getElementById("status").textContent =
        "Não foi possível abrir o PDF. Verifique o arquivo.";
      console.error(erro);
    }
  } else {
    await mostrarPagina(paginaAtual);
  }
}

function voltarInicio() {
  document.getElementById("leitor").style.display = "none";
  document.getElementById("inicio").style.display = "flex";
}

function criarPaginas() {
  const area = document.getElementById("areaLeitura");
  area.innerHTML = "";

  for (let numero = 1; numero <= totalPaginas; numero++) {
    const bloco = document.createElement("div");
    bloco.className = "pagina";
    bloco.id = "pagina-" + numero;
    bloco.dataset.numero = numero;

    const aviso = document.createElement("div");
    aviso.className = "carregandoPagina";
    aviso.textContent = "Página " + numero;

    bloco.appendChild(aviso);
    area.appendChild(bloco);

    paginasElementos[numero] = bloco;
  }

  if ("IntersectionObserver" in window) {
    observador = new IntersectionObserver(
      function(entradas) {
        entradas.forEach(function(entrada) {
          if (entrada.isIntersecting) {
            const numero = Number(entrada.target.dataset.numero);
            renderizarPagina(numero);
            paginaAtual = numero;

            document.getElementById("numeroPagina").textContent =
              "Página " + numero + " de " + totalPaginas;
          }
        });
      },
      {
        root: area,
        rootMargin: "900px 0px",
        threshold: 0
      }
    );

    Object.values(paginasElementos).forEach(function(bloco) {
      observador.observe(bloco);
    });
  }
}

async function renderizarPagina(numero) {
  if (!pdf || paginasRenderizadas[numero] ||
      paginasRenderizando[numero]) {
    return;
  }

  paginasRenderizando[numero] = true;

  try {
    const pagina = await pdf.getPage(numero);
    const bloco = paginasElementos[numero];
    const largura = Math.max(200, bloco.clientWidth);

    const viewportOriginal = pagina.getViewport({ scale: 1 });
    const escala = largura / viewportOriginal.width;
    const densidade = window.devicePixelRatio || 1;

    const viewportRender = pagina.getViewport({
      scale: escala * densidade
    });

    const canvas = document.createElement("canvas");
    const contexto = canvas.getContext("2d");

    canvas.width = viewportRender.width;
    canvas.height = viewportRender.height;

    canvas.style.width = "100%";
    canvas.style.height = "auto";

    bloco.innerHTML = "";
    bloco.appendChild(canvas);

    await pagina.render({
      canvasContext: contexto,
      viewport: viewportRender
    }).promise;

    paginasRenderizadas[numero] = true;

  } catch (erro) {
    console.error("Erro ao renderizar página", numero, erro);
  }

  paginasRenderizando[numero] = false;
}

async function mostrarPagina(numero) {
  if (!pdf) return;

  numero = Math.max(1, Math.min(numero, totalPaginas));
  paginaAtual = numero;

  const bloco = paginasElementos[numero];

  if (bloco) {
    await renderizarPagina(numero);

    bloco.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  document.getElementById("numeroPagina").textContent =
    "Página " + numero + " de " + totalPaginas;
}

async function obterTexto(numero) {
  if (textosPaginas[numero] !== undefined) {
    return textosPaginas[numero];
  }

  const pagina = await pdf.getPage(numero);
  const conteudo = await pagina.getTextContent();

  const texto = conteudo.items
    .map(item => item.str)
    .join(" ");

  textosPaginas[numero] = texto;
  return texto;
}

function encontrarCabecalho(texto, livro, capitulo) {
  const nome = escaparRegex(livro);

  const regex = new RegExp(
    "(?:^|\\s)" + nome + "\\s+" + capitulo +
    "(?=\\s|$|[:.,])",
    "i"
  );

  return regex.test(texto);
}

function encontrarVersiculo(texto, versiculo) {
  const regex = new RegExp(
    "(?:^|\\s)" + versiculo +
    "\\s+(?=[A-ZÁÉÍÓÚÀÂÊÔÃÕÇ(])",
    "g"
  );

  const resultado = regex.exec(texto);
  return resultado ? resultado.index : -1;
}

async function pesquisarReferencia(livro, capitulo, versiculo) {
  let paginaCapitulo = 0;

  for (let numero = 1; numero <= totalPaginas; numero++) {
    const texto = await obterTexto(numero);

    if (encontrarCabecalho(texto, livro, capitulo)) {
      paginaCapitulo = numero;
      break;
    }
  }

  if (!paginaCapitulo) return null;

  if (!versiculo) {
    return {
      pagina: paginaCapitulo,
      texto: "Capítulo localizado no PDF."
    };
  }

  for (let numero = paginaCapitulo; numero <= totalPaginas; numero++) {
    const texto = await obterTexto(numero);

    if (
      numero > paginaCapitulo &&
      encontrarCabecalho(texto, livro, capitulo + 1)
    ) {
      break;
    }

    const posicao = encontrarVersiculo(texto, versiculo);

    if (posicao >= 0) {
      return {
        pagina: numero,
        texto: texto.substring(posicao, posicao + 350)
      };
    }
  }

  return {
    pagina: paginaCapitulo,
    texto: "O capítulo foi localizado, mas não consegui identificar com segurança o versículo no texto extraído."
  };
}

async function pesquisar() {
  if (!pdf) {
    await abrirLivro();
    if (!pdf) return;
  }

  const consulta = document.getElementById("campoPesquisa").value.trim();
  const resultados = document.getElementById("resultados");
  const trecho = document.getElementById("trechoEncontrado");
  const status = document.getElementById("status");

  resultados.innerHTML = "";
  trecho.style.display = "none";

  if (!consulta) {
    status.textContent = "Digite o que deseja pesquisar.";
    return;
  }

  status.textContent = "Pesquisando no livro...";

  const referencia = consulta.match(
    /^(.+?)\s+(\d{1,3})(?:\s*:\s*(\d{1,3}))?$/
  );

  if (referencia) {
    const nomeDigitado = normalizar(referencia[1]);

    const livro = livros.find(function(nome) {
      return normalizar(nome) === nomeDigitado;
    });

    if (!livro) {
      status.textContent =
        "Não reconheci o nome do livro. Confira a escrita.";
      return;
    }

    const capitulo = Number(referencia[2]);
    const versiculo = referencia[3]
      ? Number(referencia[3])
      : null;

    const resultado = await pesquisarReferencia(
      livro, capitulo, versiculo
    );

    if (resultado) {
      await mostrarPagina(resultado.pagina);

      trecho.style.display = "block";

      const titulo = document.createElement("strong");
      titulo.textContent = livro + " " + capitulo +
        (versiculo ? ":" + versiculo : "");

      const texto = document.createElement("p");
      texto.textContent = resultado.texto;

      trecho.replaceChildren(titulo, texto);

      status.textContent =
        "Referência localizada na página " +
        resultado.pagina + " do PDF.";

    } else {
      status.textContent =
        "Não consegui localizar essa referência no arquivo.";
    }

    return;
  }

  const palavra = normalizar(consulta);
  let quantidade = 0;

  for (let numero = 1; numero <= totalPaginas; numero++) {
    const texto = await obterTexto(numero);

    if (normalizar(texto).includes(palavra)) {
      const botao = document.createElement("div");
      botao.className = "resultado";
      botao.textContent = "Encontrado na página " + numero;

      botao.onclick = async function() {
        await mostrarPagina(numero);
      };

      resultados.appendChild(botao);
      quantidade++;

      if (quantidade >= 30) break;
    }
  }

  status.textContent = quantidade
    ? quantidade + " resultado(s) encontrado(s)."
    : "Nenhum resultado encontrado.";
}

function paginaAnterior() {
  if (paginaAtual > 1) {
    mostrarPagina(paginaAtual - 1);
  }
}

function proximaPagina() {
  if (paginaAtual < totalPaginas) {
    mostrarPagina(paginaAtual + 1);
  }
}

window.addEventListener("resize", function() {
  if (!pdf) return;

  Object.keys(paginasRenderizadas).forEach(function(numero) {
    const bloco = paginasElementos[numero];

    if (bloco) {
      delete paginasRenderizadas[numero];
      bloco.innerHTML = "";

      const aviso = document.createElement("div");
      aviso.className = "carregandoPagina";
      aviso.textContent = "Página " + numero;
      bloco.appendChild(aviso);
    }
  });

  paginasRenderizando = {};
  renderizarPagina(paginaAtual);
});

async function compartilhar() {
  const link = window.location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "Evangelho Sagrado Sem Joio",
        text: "Acesse e leia o Evangelho Sagrado Sem Joio.",
        url: link
      });
    } catch (erro) {
      console.log(erro);
    }
  } else {
    try {
      await navigator.clipboard.writeText(link);
      alert("Link copiado para compartilhar!");
    } catch (erro) {
      alert("Copie o endereço do aplicativo para compartilhar.");
    }
  }
}
</script>

</body>
</html>
